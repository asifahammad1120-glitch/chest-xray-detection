{% extends "core/base.html" %}
{% block title %}Log in · ChestXray AI{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="feature-icon mb-3"><i class="bi bi-person-lock"></i></div>
            <h4 class="fw-bold mb-1">Welcome back</h4>
            <p class="text-muted small mb-0">Log in as a patient, doctor, or admin</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
        </form>
        <hr class="my-4">
        <p class="text-center small text-muted mb-0">
            New here? <a href="{% url 'patient_register' %}">Register as patient</a> ·
            <a href="{% url 'doctor_register' %}">Register as doctor</a>
        </p>
    </div>
</div>
{% endblock %}
