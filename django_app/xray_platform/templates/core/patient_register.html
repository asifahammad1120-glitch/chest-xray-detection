{% extends "core/base.html" %}
{% block title %}Patient registration · ChestXray AI{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card p-4 p-md-5">
        <h4 class="fw-bold mb-1">Create a patient account</h4>
        <p class="text-muted small mb-4">Submit X-rays and view your verified reports.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "core/_form.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Create account</button>
        </form>
        <p class="text-center small text-muted mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
