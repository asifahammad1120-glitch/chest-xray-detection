{% extends "core/base.html" %}
{% block title %}New examination · ChestXray AI{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card p-4 p-md-5">
        <h4 class="fw-bold mb-1">New X-ray examination</h4>
        <p class="text-muted small mb-4">The AI analysis runs automatically after you submit.</p>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include "core/_form.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                <i class="bi bi-cpu me-1"></i>Submit for AI analysis
            </button>
        </form>
    </div>
</div>
{% endblock %}
