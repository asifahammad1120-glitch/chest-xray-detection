{% extends "core/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3">Doctor / Radiologist Registration</h4>
            <p class="text-muted small">Your account will need admin approval before you can log in.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
